version: 2.1
jobs:
  build:
    docker:
      - image: cimg/node:24.19
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package.json" }}
            - v1-deps-
      - run:
          name: Install Packages
          command: |
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
      - save_cache:
          paths:
            - node_modules
          key: v1-deps-{{ checksum "package.json" }}

      - run:
          name: Build
          command: npm run build
      - run:
          name: Lint (ESLint + SonarJS)
          command: npm run lint
      - run:
          name: Test with Coverage
          command: npx vitest --coverage

  docker-publish:
    machine:
      image: ubuntu-2204:2024.01.1
    resource_class: medium
    environment:
      # BuildKit layer cache ref (ghcr.io registry cache, mode=max). Cache-only
      # tag — never used as a deployable image.
      CACHE_REF: ghcr.io/nickbrett1/pshelf:buildcache
    steps:
      - checkout
      - run:
          name: Login to Container Registry
          command: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
      - run:
          name: Build and Push Multi-Arch Image
          command: |
            docker buildx create --use --bootstrap || true
            docker buildx build --platform linux/amd64,linux/arm64 \
              --cache-from type=registry,ref=$CACHE_REF \
              --cache-to type=registry,ref=$CACHE_REF,mode=max \
              -t ghcr.io/nickbrett1/pshelf:$CIRCLE_SHA1 -t ghcr.io/nickbrett1/pshelf:latest --push .
workflows:
  build-and-test:
    jobs:
      - build:
          context: common

      - docker-publish:
          context: common
          requires:
            - build
          filters:
            branches:
              only: main
