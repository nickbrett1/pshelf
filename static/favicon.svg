<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- PlayStation 4-button icon on dark theme tile -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#182a44"/>
      <stop offset="100%" stop-color="#0b1422"/>
    </radialGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <rect x="7" y="7" width="86" height="86" rx="18" fill="none" stroke="#2a4060" stroke-width="2" opacity="0.6"/>

  <!-- Triangle (green, top-left) -->
  <path d="M32 20 L18 46 L46 46 Z" fill="#00e676"/>

  <!-- Circle (red, top-right) -->
  <circle cx="68" cy="33" r="13" fill="#ff1744"/>

  <!-- Cross (blue, bottom-left) - pure polygons, no transforms -->
  <polygon points="21,59 25,55 43,73 39,77" fill="#00e5ff"/>
  <polygon points="39,55 43,59 25,77 21,73" fill="#00e5ff"/>

  <!-- Square (pink, bottom-right) -->
  <rect x="55" y="54" width="26" height="26" rx="6" fill="#f50057"/>
</svg>
