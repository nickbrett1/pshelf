<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Bubble Bobble themed favicon: Bub the dragon inside a blue bubble -->
  <!-- tile background -->
  <rect width="100" height="100" rx="22" fill="#0c1f36"/>

  <!-- bubble body -->
  <circle cx="50" cy="50" r="40" fill="#38a3e5" opacity="0.35"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#90d5ff" stroke-width="3"/>
  <circle cx="50" cy="50" r="37" fill="none" stroke="#e0f4ff" stroke-width="1" opacity="0.6"/>
  <!-- bubble gleam -->
  <ellipse cx="36" cy="27" rx="10" ry="5" fill="#ffffff" opacity="0.75" transform="rotate(-30 36 27)"/>
  <circle cx="64" cy="72" r="3" fill="#ffffff" opacity="0.45"/>

  <!-- Bub the dragon -->
  <g>
    <!-- horns -->
    <path d="M29 36 L22 21 L39 31 Z" fill="#f8c846"/>
    <path d="M71 36 L78 21 L61 31 Z" fill="#f8c846"/>
    <!-- head -->
    <ellipse cx="50" cy="56" rx="25" ry="21" fill="#44b443"/>
    <ellipse cx="50" cy="62" rx="24" ry="16" fill="#389a37"/>
    <!-- snout -->
    <ellipse cx="50" cy="69" rx="14" ry="9" fill="#fed874"/>
    <!-- eyes -->
    <circle cx="38" cy="50" r="9.5" fill="#ffffff"/>
    <circle cx="62" cy="50" r="9.5" fill="#ffffff"/>
    <circle cx="39.5" cy="50" r="5" fill="#181818"/>
    <circle cx="60.5" cy="50" r="5" fill="#181818"/>
    <!-- eye gleams -->
    <circle cx="41.5" cy="47.5" r="2" fill="#ffffff"/>
    <circle cx="62.5" cy="47.5" r="2" fill="#ffffff"/>
    <!-- nostrils -->
    <circle cx="45" cy="65" r="1.6" fill="#246023"/>
    <circle cx="55" cy="65" r="1.6" fill="#246023"/>
    <!-- smile -->
    <path d="M44 71 Q50 75 56 71" stroke="#246023" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
